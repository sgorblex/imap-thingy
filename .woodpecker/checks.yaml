# Required on `main` as `ci/woodpecker/pr/checks`. Keep path or branch filters out of this
# top-level `when`: a miss starts no run, so no status is posted and GitHub shows the required
# check as pending forever. The one deliberate use is `ci:pause`: a labelled PR gets no run,
# so it can't merge until the label is removed *and* a new commit is pushed.
#
# Release Please PRs run this too: their `uv.lock` bump is what `uv sync --locked` verifies.
when:
  - event: push
    branch: main
  - event: pull_request
    evaluate: 'not ("ci:pause" in split(CI_COMMIT_PULL_REQUEST_LABELS, ","))'

steps:
  - name: check
    image: ghcr.io/astral-sh/uv:0.12.21-python3.14-trixie-slim@sha256:8f4ab6a0f2cc074290ba6a136eb016350b2b6b93a2108e07b72724901ad1914f
    # Bind mounts need the repo marked "trusted" on the Woodpecker server.
    volumes: &uv-cache
      - /var/lib/woodpecker-cache/uv:/root/.cache/uv
    commands:
      - uv sync --locked --all-groups
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run mypy .

  - name: test
    image: ghcr.io/astral-sh/uv:0.12.21-python3.14-trixie-slim@sha256:8f4ab6a0f2cc074290ba6a136eb016350b2b6b93a2108e07b72724901ad1914f
    volumes: *uv-cache
    commands:
      - uv run pytest --cov=imap_thingy --cov-report=term-missing

  - name: build
    image: ghcr.io/astral-sh/uv:0.12.21-python3.14-trixie-slim@sha256:8f4ab6a0f2cc074290ba6a136eb016350b2b6b93a2108e07b72724901ad1914f
    volumes: *uv-cache
    commands:
      - uv build
