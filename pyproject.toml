[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["imap_thingy", "imap_thingy.*"]

[project]
name = "imap-thingy"
version = "0.3.0"
description = "An IMAP scripting library for creating advanced email filters and automation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imapclient>=3.1.0",
    "mail-parser>=4.1.4",
]

[dependency-groups]
dev = [
    "ipython>=9.11.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    # Bounded to one minor: an open floor lets lock file maintenance pull new lint rules into a
    # green branch with no dependency PR. Widen deliberately, fixing the new diagnostics.
    "mypy>=1.19,<1.20",
    "ruff>=0.15,<0.16",
]

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
warn_unreachable = true
extra_checks = true
pretty = true

[[tool.mypy.overrides]]
module = [ "imapclient.*", "mailparser.*" ]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
  "A", "ANN", "B", "C4", "D", "DTZ", "E", "EXE", "F", "FA", "I", "ICN", "ISC", "LOG", "N",
  "PIE", "PLE", "PLW", "PT", "PYI", "Q", "RET", "RSE", "RUF", "SIM", "SLF", "SLOT", "TC",
  "TID", "UP", "W", "YTT",
]
ignore = ["D203", "D213", "D105"]

[tool.ruff.lint.isort]
known-first-party = ["imap_thingy"]

[tool.ruff.lint.per-file-ignores]
# Tests mock imapclient's private `_raw_command_untagged`, which search_mail calls.
"tests/**/*.py" = ["D", "SLF001"]
